# ==============================================================================
# KITTY CONFIGURATION - MODERN & ERGONOMIC SETUP
# ==============================================================================

# ------------------------------------------------------------------------------
# Typography
# ------------------------------------------------------------------------------
# BEGIN_KITTY_FONTS
font_family      family='FiraCode Nerd Font' postscript_name=FiraCodeNF-Reg
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size                  13.0
modify_font cell_height    108%
modify_font underline_position +2
disable_ligatures          cursor
undercurl_style            thin-dense

# ------------------------------------------------------------------------------
# Window Layout & Padding
# ------------------------------------------------------------------------------
window_padding_width       10 14
placement_strategy         center
hide_window_decorations    yes
background_opacity         0.90
dynamic_background_opacity yes
confirm_os_window_close    0

repaint_delay              10
input_delay                3
sync_to_monitor            yes

# ------------------------------------------------------------------------------
# Cursor & Smooth Trails (Kitty 0.47+)
# ------------------------------------------------------------------------------
cursor_shape               block
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0
cursor_trail               3
cursor_trail_decay         0.1 0.35
cursor_trail_start_threshold 2

# ------------------------------------------------------------------------------
# Tab Bar (Modern Rounded Bubble Style on Bottom)
# ------------------------------------------------------------------------------
tab_bar_edge               bottom
tab_bar_style              powerline
tab_powerline_style        round
tab_bar_align              left
tab_bar_min_tabs           2
tab_title_template         " {index} {title} "
active_tab_font_style      bold
inactive_tab_font_style    normal

# ------------------------------------------------------------------------------
# Scrollback & Mouse
# ------------------------------------------------------------------------------
scrollback_lines           10000
copy_on_select             yes
strip_trailing_spaces      smart
mouse_hide_wait            3.0
detect_urls                yes
url_style                  curly

# ------------------------------------------------------------------------------
# Audio & Visual Alerts
# ------------------------------------------------------------------------------
enable_audio_bell          no
visual_bell_duration       0.0
window_alert_on_bell       yes

# ------------------------------------------------------------------------------
# Keybindings & Remote Control
# ------------------------------------------------------------------------------
shell_integration          enabled
allow_remote_control       yes
listen_on                  unix:@mykitty

map ctrl+shift+n           new_os_window
map ctrl+t                 new_tab
map ctrl+plus              change_font_size all +1.0
map ctrl+minus             change_font_size all -1.0
map ctrl+0                 change_font_size all 0

# ------------------------------------------------------------------------------
# Theme Include
# ------------------------------------------------------------------------------
# BEGIN_KITTY_THEME
# Charcoal Amber
include current-theme.conf
# END_KITTY_THEME

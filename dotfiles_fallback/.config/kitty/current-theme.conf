# vim:ft=kitty
## name: Charcoal Amber
## author: Harmonized with starship.toml
## blurb: High-contrast warm charcoal & amber colorscheme optimized for all-day and nighttime legibility.

#: The basic colors
foreground                      #eeeeee
background                      #222831
selection_foreground            #eeeeee
selection_background            #393e46

#: Cursor colors
cursor                          #ffd369
cursor_text_color               #222831

#: URL underline color when hovering with mouse
url_color                       #56b6c2

#: kitty window border colors and terminal bell colors
active_border_color             #ffd369
inactive_border_color           #393e46
bell_border_color               #e06c75
visual_bell_color               none

#: OS Window titlebar colors
wayland_titlebar_color          system
macos_titlebar_color            system

#: Tab bar colors
active_tab_foreground           #222831
active_tab_background           #ffd369
inactive_tab_foreground         #eeeeee
inactive_tab_background         #393e46
tab_bar_background              none
tab_bar_margin_color            none

#: Colors for marks (marked text in the terminal)
mark1_foreground #222831
mark1_background #ffd369
mark2_foreground #222831
mark2_background #56b6c2
mark3_foreground #222831
mark3_background #e06c75

#: The basic 16 colors

#: black
color0 #222831
color8 #7f848e

#: red
color1 #e06c75
color9 #ef7d86

#: green
color2  #98c379
color10 #a9d389

#: yellow
color3  #ffd369
color11 #ffe08a

#: blue
color4  #61afef
color12 #73beff

#: magenta
color5  #c678dd
color13 #d88eef

#: cyan
color6  #56b6c2
color14 #68c7d3

#: white
color7  #abb2bf
color15 #ffffff
